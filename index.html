<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>OB55 VIP PROXY SERVER</title>

  <style>
    :root{
      --bg:#f4f4f4;
      --text:#111;
      --muted:#666;
      --green:#19ad4f;
      --yellow:#ffd900;
      --line:#e7e7e7;
      --shadow:0 10px 28px rgba(0,0,0,.12);
      --max:760px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }
    .page{width:min(100%,var(--max));margin:auto;padding:16px 14px 36px}
    .top-card{
      background:#fff;border:1px solid var(--line);border-radius:15px;
      padding:12px 14px;margin-bottom:18px
    }
    .top-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .notice{font-weight:900}
    .clock-wrap{text-align:right}
    .clock{font-weight:900;font-variant-numeric:tabular-nums}
    .date{color:var(--muted);font-size:12px;margin-top:3px;font-weight:700}
    h1{
      text-align:center;margin:8px 0 18px;
      font-size:clamp(30px,7vw,52px);line-height:1;font-weight:950
    }
    .video-shell{
      position:relative;width:100%;aspect-ratio:16/9;background:#000;
      border-radius:20px;overflow:hidden;box-shadow:var(--shadow)
    }
    .video-shell iframe{width:100%;height:100%;border:0;display:block;background:#000}
    .badge{
      width:max-content;margin:24px auto 10px;padding:10px 24px;
      border-radius:999px;background:var(--yellow);font-weight:900
    }
    .product{text-align:center}
    .product h2{
      margin:4px 0 0;font-size:clamp(30px,7vw,50px);
      font-weight:950;line-height:1.05
    }
    .subtitle{
      color:var(--muted);font-weight:700;margin:10px 0 14px;
      font-size:clamp(14px,3.7vw,19px)
    }
    .rating{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 24px}
    .stars{color:#f1aa00;font-size:30px;letter-spacing:2px}
    .install{
      display:block;width:100%;text-align:center;text-decoration:none;
      background:var(--green);color:#fff;padding:22px 18px;border-radius:18px;
      font-size:clamp(22px,6vw,34px);font-weight:950;
      box-shadow:0 10px 24px rgba(25,173,79,.28)
    }
    .section-title{font-size:clamp(24px,6vw,38px);font-weight:950;margin:30px 0 12px}
    .activity{
      border-radius:18px;
      padding:15px 16px;
      margin-bottom:11px;
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 7px 18px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .activity b{
      display:block;
      margin-bottom:7px;
      font-size:18px;
      color:#111;
    }
    .activity small{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:7px;
      font-size:14px;
      font-weight:800;
      color:#222;
    }
    .time-pill{
      display:inline-block;
      background:rgba(255,255,255,.78);
      padding:5px 9px;
      border-radius:999px;
      color:#444;
      font-weight:800;
    }
    .status-pill{
      display:inline-block;
      padding:6px 11px;
      border-radius:999px;
      font-weight:950;
      letter-spacing:.1px;
    }

    .status-download{
      background:linear-gradient(135deg,#dff4ff,#aee4ff);
    }
    .status-download .status-pill{
      color:#005e9c;
      background:#c8ecff;
    }

    .status-success{
      background:linear-gradient(135deg,#e4ffe9,#bff5ca);
    }
    .status-success .status-pill{
      color:#087d32;
      background:#c9f7d4;
    }

    .status-install{
      background:linear-gradient(135deg,#fff0dc,#ffd7aa);
    }
    .status-install .status-pill{
      color:#a65200;
      background:#ffe1bf;
    }

    .status-setup{
      background:linear-gradient(135deg,#efe4ff,#d8c0ff);
    }
    .status-setup .status-pill{
      color:#6c2db6;
      background:#e1ccff;
    }

    .status-link{
      background:linear-gradient(135deg,#dcfff9,#b5f4e7);
    }
    .status-link .status-pill{
      color:#067c69;
      background:#c8f8ef;
    }

    .status-complete{
      background:linear-gradient(135deg,#ffe1f2,#ffc0e1);
    }
    .status-complete .status-pill{
      color:#a61e64;
      background:#ffd0e8;
    }
    .foot{text-align:center;color:#777;font-size:12px;margin-top:18px;line-height:1.45}
  </style>
</head>

<body>
<main class="page">

  <div class="top-card">
    <div class="top-line">
      <div class="notice">⚡ OB55 VIP PROXY SERVER</div>
      <div class="clock-wrap">
        <div class="clock" id="indiaClock">--:--:--</div>
        <div class="date" id="indiaDate"></div>
      </div>
    </div>
  </div>

  <h1>WATCH FULL VIDEO</h1>

  <div class="video-shell">
    <!-- IMPORTANT:
         This is a normal YouTube embed, not a direct /embed URL opened by itself.
         GitHub Pages should provide the HTTP Referer YouTube requires. -->
    <iframe
      src="https://www.youtube.com/embed/fCCL0IJS8oU?autoplay=1&mute=0&loop=1&playlist=fCCL0IJS8oU&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=https%3A%2F%2Fsujitssr1-cmdsujit.github.io"
      title="OB55 VIP PROXY SERVER video"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
  </div>

  <div class="badge">NEW PREMIUM</div>

  <section class="product">
    <h2>OB55 VIP PROXY SERVER</h2>
    <div class="subtitle">Fast access • video guide • download page</div>

    <div class="rating">
      <span class="stars">★★★★★</span>
      <span>4.9 / 5</span>
    </div>

    <a
      id="installBtn"
      class="install"
      href="https://1024terabox.com/s/18Magj5s3cXjLdNodBZQ8iQ"
      target="_blank"
      rel="noopener noreferrer">
      ↓ INSTALL NOW
    </a>
  </section>

  <div class="section-title">Demo Activity</div>
  <div id="activityList"></div>

  <div class="foot">
    Demo activity is simulated for design preview only. For real user activity, connect the page to a backend/database.
  </div>

</main>

<script>
  const demoNames = [
    "Aman","Rahul","Vikas","Arjun","Mohit","Harsh","Ankit","Rohan",
    "Saurabh","Deepak","Manish","Abhishek","Ravi","Sachin","Pankaj","Nitin"
  ];

  const demoActions = [
    {text:"⬇ Downloading started", cls:"status-download"},
    {text:"✅ Installed successfully", cls:"status-success"},
    {text:"📦 Install started", cls:"status-install"},
    {text:"⚙ Setup opened", cls:"status-setup"},
    {text:"🔗 Download link opened", cls:"status-link"},
    {text:"🎉 Setup completed", cls:"status-complete"}
  ];

  function updateIndiaClock(){
    const now = new Date();

    document.getElementById("indiaClock").textContent =
      new Intl.DateTimeFormat("en-IN",{
        timeZone:"Asia/Kolkata",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }).format(now) + " IST";

    document.getElementById("indiaDate").textContent =
      new Intl.DateTimeFormat("en-IN",{
        timeZone:"Asia/Kolkata",
        weekday:"short",
        day:"2-digit",
        month:"short",
        year:"numeric"
      }).format(now);
  }

  updateIndiaClock();
  setInterval(updateIndiaClock,1000);

  const activityList = document.getElementById("activityList");

  function addDemoActivity(){
    const name = demoNames[Math.floor(Math.random()*demoNames.length)];
    const action = demoActions[Math.floor(Math.random()*demoActions.length)];
    const seconds = Math.floor(Math.random()*9)+4;

    const row = document.createElement("div");
    row.className = "activity " + action.cls;
    row.innerHTML = `
      <b>${name}</b>
      <small>
        <span class="time-pill">${seconds} sec ago</span>
        <span class="status-pill">${action.text}</span>
      </small>`;

    activityList.prepend(row);

    while(activityList.children.length > 6){
      activityList.removeChild(activityList.lastElementChild);
    }
  }

  // Fill initial demo rows
  for(let i=0;i<5;i++) addDemoActivity();

  // Add a new demo row every 6–10 seconds
  function scheduleNext(){
    const delay = 6000 + Math.floor(Math.random()*4000);
    setTimeout(()=>{
      addDemoActivity();
      scheduleNext();
    }, delay);
  }
  scheduleNext();

  // Real local event: this visitor's own Install-button click
  document.getElementById("installBtn").addEventListener("click",()=>{
    const row = document.createElement("div");
    row.className = "activity status-download";
    row.innerHTML = `
      <b>You</b>
      <small>
        <span class="time-pill">just now</span>
        <span class="status-pill">⬇ Downloading started</span>
      </small>`;
    activityList.prepend(row);
  });
</script>
</body>
</html>
